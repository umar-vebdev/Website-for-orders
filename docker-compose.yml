services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: food-project-app
    container_name: food-project-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      - VITE_PUSHER_APP_KEY=${VITE_PUSHER_APP_KEY}
      - VITE_PUSHER_APP_CLUSTER=${VITE_PUSHER_APP_CLUSTER}
    ports:
      - "5173:5173"
    networks:
      - food-project-network
    depends_on:
      - db
    command: ["app"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: food-project-app
    container_name: food-project-worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file:
      - .env
    networks:
      - food-project-network
    depends_on:
      - db
      - redis
    command: ["worker"]

  nginx:
    image: nginx:stable-alpine
    container_name: food-project-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - food-project-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: food-project-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-foodproject}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - food-project-db-data:/var/lib/mysql
    networks:
      - food-project-network

  redis:
    image: redis:7.0-alpine
    container_name: food-project-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - food-project-network

networks:
  food-project-network:
    driver: bridge

volumes:
  food-project-db-data:
    driver: local
